name: Build and test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore A320Copilot.slnx
      - run: dotnet build A320Copilot.slnx --configuration Release --no-restore
      - run: dotnet test A320Copilot.slnx --configuration Release --no-build
      - run: pwsh -File scripts/Test-Mcp.ps1 -Mode Mock
      - run: pwsh -File scripts/Test-Mcp.ps1 -Mode Settings
      - name: Verify plugin installer without network or simulator
        run: powershell -NoProfile -File scripts/Test-PluginInstaller.ps1
      - run: dotnet run --project src/A320Copilot.Mcp --configuration Release --no-build -- --demo
